name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the worldbuilding task or frustration, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
  - type: checkboxes
    id: canon
    attributes:
      label: Canon safety
      options:
        - label: This idea keeps the creator in control of canon (nothing becomes canon without explicit acceptance).
